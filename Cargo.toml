[package]
name = "pymdf4-rs"
version = "0.2.0"
edition = "2024"
license = "MIT or Apache-2.0"
authors = ["Martin Bammer <mrbm74@gmail.com>"]
description = "A Python library for parsing and generating MDF4 files using Rust mdf4-rs"
repository = "https://github.com/brmmm3/pymdf4-rs"
documentation = "https://github.com/brmmm3/pymdf4-rs"
keywords = ["mf4", "mdf4", "python", "rust"]


[lib]
name = "pymdf4"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
mdf4-rs = { git = "https://github.com/brmmm3/mdf4-rs.git", tag = "0.7.0", features = ["std", "compression"] }
#mdf4-rs = { path = "../mdf4-rs", features = ["std", "compression"] }
rayon = "1.10"
