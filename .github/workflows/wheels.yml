name: Build wheels

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tag:
    name: Detect release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Find version tag on the current commit
        id: detect
        shell: bash
        run: |
          tags=$(git ls-remote --tags origin \
            | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -uV || true)
          if [ -z "$tags" ]; then
            echo "No release version tag points at $GITHUB_SHA."
          elif [ "$(printf '%s\n' "$tags" | wc -l)" -gt 1 ]; then
            echo "::error::Multiple release version tags point at $GITHUB_SHA: $(echo $tags)"
            exit 1
          else
            echo "Release version tag for $GITHUB_SHA: $tags"
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"

  wheels:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: windows-x86_64
            runner: windows-2025
          - name: macos-arm64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2_28"
          args: --release --locked --out dist -i python${{ matrix.python }}
      - name: Build Windows or macOS wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist -i python
      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install numpy dist/*.whl
          python -c "import numpy, pymdf4; print('numpy', numpy.__version__); print('pymdf4', pymdf4.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    if: needs.release-tag.outputs.tag != ''
    needs: [release-tag, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-tag.outputs.tag }}
          files: dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
